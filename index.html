<!DOCTYPE html>
<!--
  index.html – die Startseite der App.
  Der Browser lädt zuerst diese Datei. Sie beschreibt den Aufbau der Seite
  (welche Bereiche und Knöpfe es gibt) und bindet Aussehen (CSS) und
  Verhalten (JavaScript) ein.

  data-theme="dark"  -> Startwert für das Design, wird von main.js gesetzt.
-->
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite auf dem Handy nicht winzig angezeigt wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Statistics</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA: Manifest beschreibt die App für die Installation (Name, Symbol, Farben) -->
  <link rel="manifest" href="manifest.json">
  <!-- Farbe der Statusleiste am Handy -->
  <meta name="theme-color" content="#121417">
  <!-- Symbol im Browser-Tab und für iPhone/iPad -->
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <!-- Kopfzeile mit App-Name und den beiden Schaltern -->
  <header class="topbar">
    <!-- data-i18n="app.title": hier setzt i18n.js den Text aus der Sprachdatei ein -->
    <h1 data-i18n="app.title">Volleyball Statistics</h1>

    <div class="topbar-buttons">
      <!-- Sprache umschalten (DE <-> EN) -->
      <button id="btn-language" class="btn" data-i18n="settings.switchLanguage">EN</button>
      <!-- Design umschalten (hell <-> dunkel) -->
      <button id="btn-theme" class="btn" data-i18n="settings.themeLight">Hell</button>
    </div>
  </header>

  <!-- Hauptbereich. Meilenstein 1a: vorläufiger Testbildschirm für das Kreismenü -->
  <main id="app">
    <section class="card">
      <h2 data-i18n="test.title">Kreismenü-Test</h2>
      <p data-i18n="test.hint">…</p>

      <!-- Halbes Spielfeld: oben das Netz, darunter 6 Spieler (werden von radial-test.js erzeugt) -->
      <div class="net"></div>
      <div id="court" class="court"></div>
    </section>

    <section class="card">
      <h2 data-i18n="test.logTitle">Letzte Eingaben</h2>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <!--
    JavaScript wird als "module" geladen. Das erlaubt, Code auf mehrere Dateien
    aufzuteilen (import/export). Deshalb braucht die Seite einen kleinen
    Webserver (Live Server in VS Code) und funktioniert nicht per Doppelklick.
  -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
